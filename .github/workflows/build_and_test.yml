name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build
        run: nix develop -c zig build -Dnix

      - name: Test
        run: nix develop -c zig build test -Dnix

      - name: Build AppImage
        run: nix develop -c zig build -Dappimage -Doptimize=ReleaseSafe

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spacecap-linux-${{ github.event.pull_request.number }}
          path: |
            zig-out/linux/spacecap
            zig-out/linux/spacecap-linux-x86_64.AppImage
          retention-days: 7
          if-no-files-found: error
